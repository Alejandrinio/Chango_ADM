<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Datos de Tablas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table-container {
            margin-bottom: 30px;
        }
        .table-title {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .json-view {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Debug - Datos de Tablas</h1>
        
        <div class="row mb-4">
            <div class="col-md-6">
                <label for="fecha-selector" class="form-label">Seleccionar Fecha:</label>
                <input type="date" id="fecha-selector" class="form-control">
            </div>
            <div class="col-md-6 d-flex align-items-end">
                <button id="cargar-datos" class="btn btn-primary">Cargar Datos</button>
                <button id="limpiar" class="btn btn-secondary ms-2">Limpiar</button>
            </div>
        </div>

        <div id="loading" class="alert alert-info" style="display: none;">
            Cargando datos...
        </div>

        <div id="error" class="alert alert-danger" style="display: none;"></div>

        <div id="resultados">
            <!-- Los resultados se cargarán aquí -->
        </div>
    </div>

    <script>
        class DebugTablas {
            constructor() {
                this.apiBase = 'http://localhost:8000/api';
                this.init();
            }

            init() {
                // Establecer fecha actual por defecto
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('fecha-selector').value = today;
                
                // Event listeners
                document.getElementById('cargar-datos').addEventListener('click', () => {
                    this.cargarDatos();
                });
                
                document.getElementById('limpiar').addEventListener('click', () => {
                    this.limpiarResultados();
                });

                // Cargar datos iniciales
                this.cargarDatos();
            }

            async cargarDatos() {
                const fecha = document.getElementById('fecha-selector').value;
                const loading = document.getElementById('loading');
                const error = document.getElementById('error');
                const resultados = document.getElementById('resultados');

                loading.style.display = 'block';
                error.style.display = 'none';
                resultados.innerHTML = '';

                try {
                    const response = await fetch(`${this.apiBase}/debug/tablas?fecha=${fecha}`);
                    const result = await response.json();

                    if (result.success) {
                        this.mostrarResultados(result.data);
                    } else {
                        throw new Error(result.error);
                    }
                } catch (err) {
                    error.textContent = `Error: ${err.message}`;
                    error.style.display = 'block';
                } finally {
                    loading.style.display = 'none';
                }
            }

            mostrarResultados(data) {
                const resultados = document.getElementById('resultados');
                
                resultados.innerHTML = `
                    <div class="alert alert-info">
                        <strong>Fecha consultada:</strong> ${data.fecha_consulta}
                    </div>

                    <div class="table-container">
                        <div class="table-title">
                            <h4>📊 Empleados (Total Activos: ${data.empleados.total_activos})</h4>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Apellido</th>
                                        <th>Rol</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.empleados.muestra.map(emp => `
                                        <tr>
                                            <td>${emp.id}</td>
                                            <td>${emp.nombre}</td>
                                            <td>${emp.apellido}</td>
                                            <td>${emp.rol}</td>
                                            <td><span class="badge bg-${emp.estado === 'activo' ? 'success' : 'secondary'}">${emp.estado}</span></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="table-container">
                        <div class="table-title">
                            <h4>⏰ Fichajes del ${data.fecha_consulta} (Total: ${data.fichajes.total_fecha})</h4>
                        </div>
                        ${data.fichajes.total_fecha > 0 ? `
                            <div class="table-responsive">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Empleado</th>
                                            <th>Fecha</th>
                                            <th>Entrada</th>
                                            <th>Salida</th>
                                            <th>Horas Trabajadas</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${data.fichajes.muestra.map(f => `
                                            <tr>
                                                <td>${f.id}</td>
                                                <td>${f.nombre} ${f.apellido}</td>
                                                <td>${f.fecha}</td>
                                                <td>${f.hora_entrada || '-'}</td>
                                                <td>${f.hora_salida || '-'}</td>
                                                <td>${f.horas_trabajadas}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        ` : `
                            <div class="alert alert-warning">
                                No hay fichajes registrados para esta fecha.
                            </div>
                        `}
                    </div>

                    <div class="table-container">
                        <div class="table-title">
                            <h4>💰 Horas Extras (Últimos 30 días)</h4>
                        </div>
                        ${data.horas_extras.muestra.length > 0 ? `
                            <div class="table-responsive">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Empleado</th>
                                            <th>Fecha</th>
                                            <th>Horas Extras</th>
                                            <th>Estado</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${data.horas_extras.muestra.map(he => `
                                            <tr>
                                                <td>${he.id}</td>
                                                <td>${he.nombre} ${he.apellido}</td>
                                                <td>${he.fecha}</td>
                                                <td>${he.horas_extras}</td>
                                                <td><span class="badge bg-${he.estado === 'aprobado' ? 'success' : 'warning'}">${he.estado}</span></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        ` : `
                            <div class="alert alert-warning">
                                No hay horas extras registradas en los últimos 30 días.
                            </div>
                        `}
                    </div>

                    <div class="table-container">
                        <div class="table-title">
                            <h4>📄 Recibos de Sueldo (Últimos 90 días)</h4>
                        </div>
                        ${data.recibos.muestra.length > 0 ? `
                            <div class="table-responsive">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Empleado</th>
                                            <th>Fecha Generación</th>
                                            <th>Estado</th>
                                            <th>Sueldo Base</th>
                                            <th>Sueldo Neto</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${data.recibos.muestra.map(rs => `
                                            <tr>
                                                <td>${rs.id}</td>
                                                <td>${rs.nombre} ${rs.apellido}</td>
                                                <td>${rs.fecha_generacion || '-'}</td>
                                                <td><span class="badge bg-${this.getEstadoColor(rs.estado)}">${rs.estado}</span></td>
                                                <td>$${rs.sueldo_base}</td>
                                                <td>$${rs.sueldo_neto}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        ` : `
                            <div class="alert alert-warning">
                                No hay recibos de sueldo en los últimos 90 días.
                            </div>
                        `}
                    </div>

                    <div class="table-container">
                        <div class="table-title">
                            <h4>📅 Fechas Disponibles en Fichajes</h4>
                        </div>
                        <div class="alert alert-info">
                            <strong>Fechas con datos:</strong> ${data.fechas_disponibles.join(', ')}
                        </div>
                    </div>

                    <div class="table-container">
                        <div class="table-title">
                            <h4>🔍 Datos JSON Completos</h4>
                        </div>
                        <div class="json-view">${JSON.stringify(data, null, 2)}</div>
                    </div>
                `;
            }

            getEstadoColor(estado) {
                switch(estado) {
                    case 'generado': return 'primary';
                    case 'firmado': return 'info';
                    case 'aprobado': return 'success';
                    case 'publicado': return 'success';
                    default: return 'secondary';
                }
            }

            limpiarResultados() {
                document.getElementById('resultados').innerHTML = '';
                document.getElementById('error').style.display = 'none';
            }
        }

        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            new DebugTablas();
        });
    </script>
</body>
</html>
