<!DOCTYPE html>
<html dir="ltr" lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sistema de Administración RRHH - Chango_ADM">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon.png">
    <title>Login - Chango_ADM</title>
    <link href="assets/libs/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="dist/css/style.min.css" rel="stylesheet">
    <style>
        .login-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo img {
            max-width: 200px;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
        .role-selector {
            margin-bottom: 20px;
        }
        .role-option {
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }
        .role-option:hover {
            border-color: #667eea;
            background-color: #f8f9ff;
        }
        .role-option.active {
            border-color: #667eea;
            background-color: #667eea;
            color: white;
        }
        .role-option i {
            font-size: 24px;
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="assets/images/logo-text.png" alt="Chango_ADM">
                <h4 class="mt-3">Sistema de Administración RRHH</h4>
                <p class="text-muted">Accede a tu portal correspondiente</p>
            </div>
            
            <div id="alert-container"></div>
            
            <!-- Selector de Rol -->
            <div class="role-selector">
                <label class="form-label">Selecciona tu tipo de usuario:</label>
                <div class="role-option" data-role="admin" onclick="selectRole('admin')">
                    <i class="fas fa-user-tie"></i>
                    <strong>Administrador / RRHH</strong>
                    <div class="small">Acceso completo al sistema</div>
                </div>
                <div class="role-option" data-role="empleado" onclick="selectRole('empleado')">
                    <i class="fas fa-user"></i>
                    <strong>Empleado</strong>
                    <div class="small">Portal de empleados</div>
                </div>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" class="form-control" id="username" name="username" required 
                           placeholder="Ingresa tu nombre de usuario">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required 
                           placeholder="Ingresa tu contraseña">
                </div>
                
                <div class="form-group">
                    <div class="custom-control custom-checkbox">
                        <input type="checkbox" class="custom-control-input" id="rememberMe">
                        <label class="custom-control-label" for="rememberMe">Recordarme</label>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login btn-block" id="loginBtn" disabled>
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>
            
            <div class="text-center mt-4">
                <a href="#" class="text-muted">¿Olvidaste tu contraseña?</a>
            </div>
            
            <hr class="my-4">
            
            <div class="text-center">
                <small class="text-muted">
                    <strong>Credenciales de Prueba:</strong><br>
                    <strong>Admin:</strong> admin / admin123<br>
                    <strong>Empleado:</strong> cristiancasas668 / password
                </small>
            </div>
        </div>
    </div>

    <script src="assets/libs/jquery/dist/jquery.min.js"></script>
    <script src="assets/libs/bootstrap/dist/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <script>
        class UnifiedLogin {
            constructor() {
                this.apiBase = 'http://localhost:8000/api';
                this.selectedRole = null;
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.checkRememberedUser();
            }

            setupEventListeners() {
                document.getElementById('loginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.login();
                });
            }

            selectRole(role) {
                this.selectedRole = role;
                
                // Actualizar UI
                document.querySelectorAll('.role-option').forEach(option => {
                    option.classList.remove('active');
                });
                document.querySelector(`[data-role="${role}"]`).classList.add('active');
                
                // Habilitar botón de login
                document.getElementById('loginBtn').disabled = false;
                
                // Actualizar placeholder según rol
                const usernameInput = document.getElementById('username');
                if (role === 'admin') {
                    usernameInput.placeholder = 'Usuario administrador';
                } else {
                    usernameInput.placeholder = 'Nombre de usuario del empleado';
                }
            }

            checkRememberedUser() {
                const rememberedUser = localStorage.getItem('unified_remembered');
                if (rememberedUser) {
                    const userData = JSON.parse(rememberedUser);
                    document.getElementById('username').value = userData.username;
                    document.getElementById('rememberMe').checked = true;
                    
                    // Restaurar rol si existe
                    if (userData.role) {
                        this.selectRole(userData.role);
                    }
                }
            }

            async login() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('rememberMe').checked;

                if (!username || !password || !this.selectedRole) {
                    this.showAlert('Por favor completa todos los campos y selecciona tu rol', 'warning');
                    return;
                }

                try {
                    let endpoint = '';
                    let body = {};

                    if (this.selectedRole === 'admin') {
                        // Login de administrador (usar endpoint existente o crear uno)
                        endpoint = '/admin/login';
                        body = { username, password };
                    } else {
                        // Login de empleado
                        endpoint = '/empleados/login';
                        body = { username, password };
                    }

                    const response = await fetch(`${this.apiBase}${endpoint}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });

                    const result = await response.json();

                    if (result.success) {
                        // Guardar datos del usuario
                        const userData = {
                            ...result.data,
                            role: this.selectedRole
                        };
                        localStorage.setItem('user_data', JSON.stringify(userData));
                        
                        if (rememberMe) {
                            localStorage.setItem('unified_remembered', JSON.stringify({ 
                                username: username,
                                role: this.selectedRole
                            }));
                        } else {
                            localStorage.removeItem('unified_remembered');
                        }

                        // Redirigir según el rol
                        this.redirectByRole(userData);
                    } else {
                        this.showAlert(result.error || 'Credenciales incorrectas', 'danger');
                    }
                } catch (error) {
                    console.error('Error en login:', error);
                    this.showAlert('Error de conexión. Intenta nuevamente.', 'danger');
                }
            }

            redirectByRole(userData) {
                if (this.selectedRole === 'admin') {
                    // Redirigir al dashboard de administración
                    window.location.href = 'index.html';
                } else {
                    // Redirigir al portal de empleados
                    window.location.href = 'empleado-portal.html';
                }
            }

            showAlert(message, type) {
                const alertContainer = document.getElementById('alert-container');
                alertContainer.innerHTML = `
                    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                        ${message}
                        <button type="button" class="close" data-dismiss="alert">
                            <span>&times;</span>
                        </button>
                    </div>
                `;
            }
        }

        // Función global para seleccionar rol
        function selectRole(role) {
            if (window.unifiedLogin) {
                window.unifiedLogin.selectRole(role);
            }
        }

        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            window.unifiedLogin = new UnifiedLogin();
        });
    </script>
</body>

</html>
