<!DOCTYPE html>
<html dir="ltr" lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portal de Empleados - Chango_ADM">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon.png">
    <title>Portal de Empleados - Chango_ADM</title>
    <link href="assets/libs/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="dist/css/style.min.css" rel="stylesheet">
    <style>
        .login-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo img {
            max-width: 150px;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="assets/images/logo-text.png" alt="Chango_ADM">
                <h4 class="mt-3">Portal de Empleados</h4>
                <p class="text-muted">Accede a tus recibos de sueldo</p>
            </div>
            
            <div id="alert-container"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" class="form-control" id="username" name="username" required 
                           placeholder="Ingresa tu nombre de usuario">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required 
                           placeholder="Ingresa tu contraseña">
                </div>
                
                <div class="form-group">
                    <div class="custom-control custom-checkbox">
                        <input type="checkbox" class="custom-control-input" id="rememberMe">
                        <label class="custom-control-label" for="rememberMe">Recordarme</label>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login btn-block">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>
            
            <div class="text-center mt-4">
                <a href="#" class="text-muted">¿Olvidaste tu contraseña?</a>
            </div>
            
            <hr class="my-4">
            
            <div class="text-center">
                <small class="text-muted">
                    ¿Eres administrador? <a href="index.html">Accede aquí</a>
                </small>
            </div>
        </div>
    </div>

    <script src="assets/libs/jquery/dist/jquery.min.js"></script>
    <script src="assets/libs/bootstrap/dist/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <script>
        class EmpleadoLogin {
            constructor() {
                this.apiBase = 'http://localhost:8000/api';
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.checkRememberedUser();
            }

            setupEventListeners() {
                document.getElementById('loginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.login();
                });
            }

            checkRememberedUser() {
                const rememberedUser = localStorage.getItem('empleado_remembered');
                if (rememberedUser) {
                    const userData = JSON.parse(rememberedUser);
                    document.getElementById('username').value = userData.username;
                    document.getElementById('rememberMe').checked = true;
                }
            }

            async login() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('rememberMe').checked;

                if (!username || !password) {
                    this.showAlert('Por favor completa todos los campos', 'warning');
                    return;
                }

                try {
                    const response = await fetch(`${this.apiBase}/empleados/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        // Guardar datos del empleado
                        localStorage.setItem('empleado_data', JSON.stringify(result.data));
                        
                        if (rememberMe) {
                            localStorage.setItem('empleado_remembered', JSON.stringify({ username: username }));
                        } else {
                            localStorage.removeItem('empleado_remembered');
                        }

                        // Redirigir al portal del empleado
                        window.location.href = 'empleado-portal.html';
                    } else {
                        this.showAlert(result.error || 'Credenciales incorrectas', 'danger');
                    }
                } catch (error) {
                    console.error('Error en login:', error);
                    this.showAlert('Error de conexión. Intenta nuevamente.', 'danger');
                }
            }

            showAlert(message, type) {
                const alertContainer = document.getElementById('alert-container');
                alertContainer.innerHTML = `
                    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                        ${message}
                        <button type="button" class="close" data-dismiss="alert">
                            <span>&times;</span>
                        </button>
                    </div>
                `;
            }
        }

        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            new EmpleadoLogin();
        });
    </script>
</body>

</html>
