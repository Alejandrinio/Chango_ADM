<!DOCTYPE html>
<html dir="ltr" lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portal de Empleados - Chango_ADM">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon.png">
    <title>Mi Portal - Chango_ADM</title>
    <link href="assets/libs/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="dist/css/style.min.css" rel="stylesheet">
    <style>
        .badge-generado {
            background-color: #17a2b8;
            color: white;
        }
        .badge-firmado {
            background-color: #ffc107;
            color: #212529;
        }
        .badge-aprobado {
            background-color: #28a745;
            color: white;
        }
        .badge-publicado {
            background-color: #6f42c1;
            color: white;
        }
        .recibo-card {
            border: 1px solid #e9ecef;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .recibo-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        .workflow-step {
            display: inline-block;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            margin: 0 5px;
            font-weight: bold;
            font-size: 12px;
        }
        .workflow-step.active {
            background-color: #28a745;
            color: white;
        }
        .workflow-step.inactive {
            background-color: #e9ecef;
            color: #6c757d;
        }
        .navbar-empleado {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>

<body>
    <!-- Navbar del Empleado -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-empleado">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="assets/images/logo-text.png" alt="Chango_ADM" height="30">
                <span class="ml-2">Portal de Empleados</span>
            </a>
            
            <div class="navbar-nav ml-auto">
                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
                        <i class="fas fa-user-circle"></i>
                        <span id="empleado-nombre">Empleado</span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-right">
                        <a class="dropdown-item" href="#" onclick="empleadoPortal.showProfile()">
                            <i class="fas fa-user"></i> Mi Perfil
                        </a>
                        <a class="dropdown-item" href="#" onclick="empleadoPortal.showSettings()">
                            <i class="fas fa-cog"></i> Configuración
                        </a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#" onclick="empleadoPortal.logout()">
                            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Información del Empleado -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-8">
                                <h5 class="card-title">Bienvenido, <span id="empleado-nombre-completo">Empleado</span></h5>
                                <p class="card-text">
                                    <strong>Rol:</strong> <span id="empleado-rol">-</span> | 
                                    <strong>Usuario:</strong> <span id="empleado-username">-</span> | 
                                    <strong>Estado:</strong> <span class="badge badge-success">Activo</span>
                                </p>
                            </div>
                            <div class="col-md-4 text-right">
                                <div class="row">
                                    <div class="col-6">
                                        <div class="text-center">
                                            <h4 id="total-recibos">0</h4>
                                            <small class="text-muted">Total Recibos</small>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="text-center">
                                            <h4 id="recibos-pendientes">0</h4>
                                            <small class="text-muted">Pendientes</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-title">Filtros</h6>
                        <div class="row">
                            <div class="col-md-3">
                                <label for="mes-filtro">Mes:</label>
                                <select id="mes-filtro" class="form-control">
                                    <option value="">Todos los meses</option>
                                    <option value="1">Enero</option>
                                    <option value="2">Febrero</option>
                                    <option value="3">Marzo</option>
                                    <option value="4">Abril</option>
                                    <option value="5">Mayo</option>
                                    <option value="6">Junio</option>
                                    <option value="7">Julio</option>
                                    <option value="8">Agosto</option>
                                    <option value="9">Septiembre</option>
                                    <option value="10">Octubre</option>
                                    <option value="11">Noviembre</option>
                                    <option value="12">Diciembre</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="año-filtro">Año:</label>
                                <select id="año-filtro" class="form-control">
                                    <option value="">Todos los años</option>
                                    <option value="2024">2024</option>
                                    <option value="2025">2025</option>
                                    <option value="2026">2026</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="estado-filtro">Estado:</label>
                                <select id="estado-filtro" class="form-control">
                                    <option value="">Todos los estados</option>
                                    <option value="generado">Generado</option>
                                    <option value="firmado">Firmado</option>
                                    <option value="aprobado">Aprobado</option>
                                    <option value="publicado">Publicado</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label>&nbsp;</label><br>
                                <button id="aplicar-filtros" class="btn btn-primary btn-sm">
                                    <i class="fas fa-filter"></i> Aplicar
                                </button>
                                <button id="limpiar-filtros" class="btn btn-secondary btn-sm">
                                    <i class="fas fa-times"></i> Limpiar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista de Recibos -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Mis Recibos de Sueldo</h5>
                        <div id="recibos-container">
                            <div class="text-center">
                                <i class="fas fa-spinner fa-spin fa-2x"></i>
                                <p>Cargando recibos...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Firmar Recibo -->
    <div class="modal fade" id="firmarModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Firmar Recibo de Sueldo</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="recibo-detalles">
                        <!-- Los detalles del recibo se cargarán aquí -->
                    </div>
                    <hr>
                    <div class="form-group">
                        <label>Confirmación:</label>
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="confirmarFirma" required>
                            <label class="custom-control-label" for="confirmarFirma">
                                Confirmo que he revisado y estoy de acuerdo con el contenido de este recibo de sueldo
                            </label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-warning" id="btn-firmar" disabled>
                        <i class="fas fa-signature"></i> Firmar Recibo
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/libs/jquery/dist/jquery.min.js"></script>
    <script src="assets/libs/bootstrap/dist/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <script>
        class EmpleadoPortal {
            constructor() {
                this.apiBase = 'http://localhost:8000/api';
                this.empleadoData = null;
                this.recibos = [];
                this.init();
            }

            init() {
                this.checkAuth();
                this.loadEmpleadoData();
                this.setupEventListeners();
                this.loadRecibos();
            }

            checkAuth() {
                const userData = localStorage.getItem('user_data');
                if (!userData) {
                    window.location.href = 'login.html';
                    return;
                }
                
                const user = JSON.parse(userData);
                
                // Verificar que sea un empleado
                if (user.role !== 'empleado') {
                    alert('Acceso denegado. Solo empleados pueden acceder a este portal.');
                    window.location.href = 'login.html';
                    return;
                }
                
                this.empleadoData = user;
            }

            loadEmpleadoData() {
                if (this.empleadoData) {
                    document.getElementById('empleado-nombre').textContent = this.empleadoData.nombre;
                    document.getElementById('empleado-nombre-completo').textContent = `${this.empleadoData.nombre} ${this.empleadoData.apellido}`;
                    document.getElementById('empleado-rol').textContent = this.empleadoData.rol;
                    document.getElementById('empleado-username').textContent = this.empleadoData.username || 'N/A';
                }
            }

            setupEventListeners() {
                document.getElementById('aplicar-filtros').addEventListener('click', () => this.loadRecibos());
                document.getElementById('limpiar-filtros').addEventListener('click', () => this.clearFilters());
                document.getElementById('confirmarFirma').addEventListener('change', (e) => {
                    document.getElementById('btn-firmar').disabled = !e.target.checked;
                });
                document.getElementById('btn-firmar').addEventListener('click', () => this.firmarRecibo());
                
                // Establecer valores por defecto
                const currentDate = new Date();
                document.getElementById('mes-filtro').value = currentDate.getMonth() + 1;
                document.getElementById('año-filtro').value = currentDate.getFullYear();
            }

            async loadRecibos() {
                try {
                    const mes = document.getElementById('mes-filtro').value;
                    const año = document.getElementById('año-filtro').value;
                    const estado = document.getElementById('estado-filtro').value;

                    let url = `${this.apiBase}/recibos?empleado_id=${this.empleadoData.id}&size=1000`;
                    if (mes) url += `&mes=${mes}`;
                    if (año) url += `&año=${año}`;
                    if (estado) url += `&estado=${estado}`;

                    const response = await fetch(url);
                    const result = await response.json();
                    
                    if (result.success) {
                        this.recibos = result.data.recibos;
                        this.renderRecibos();
                        this.updateStats();
                    } else {
                        this.showError('Error al cargar recibos: ' + result.error);
                    }
                } catch (error) {
                    console.error('Error cargando recibos:', error);
                    this.showError('Error de conexión');
                }
            }

            renderRecibos() {
                const container = document.getElementById('recibos-container');
                
                if (this.recibos.length === 0) {
                    container.innerHTML = `
                        <div class="text-center">
                            <i class="fas fa-file-invoice-dollar fa-3x text-muted"></i>
                            <p class="mt-3">No se encontraron recibos para los filtros aplicados</p>
                        </div>
                    `;
                    return;
                }

                let html = '<div class="row">';
                
                this.recibos.forEach(recibo => {
                    html += `
                        <div class="col-md-6 col-lg-4 mb-3">
                            <div class="card recibo-card">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <h6 class="card-title mb-0">Recibo #${recibo.id}</h6>
                                        ${this.getEstadoBadge(recibo.estado)}
                                    </div>
                                    
                                    <p class="card-text">
                                        <small class="text-muted">Período: ${recibo.periodo}</small><br>
                                        <strong>Sueldo Neto:</strong> $${parseFloat(recibo.sueldo_neto).toFixed(2)}<br>
                                        <strong>Bruto:</strong> $${parseFloat(recibo.sueldo_bruto).toFixed(2)}
                                    </p>
                                    
                                    <div class="mb-2">
                                        ${this.getWorkflowSteps(recibo.estado)}
                                    </div>
                                    
                                    <div class="btn-group btn-group-sm w-100">
                                        <button class="btn btn-outline-info" onclick="empleadoPortal.viewRecibo(${recibo.id})" title="Ver Detalles">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                        ${this.getActionButton(recibo)}
                                        ${recibo.estado === 'publicado' ? `
                                            <button class="btn btn-outline-success" onclick="empleadoPortal.descargarRecibo(${recibo.id})" title="Descargar">
                                                <i class="fas fa-download"></i>
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                container.innerHTML = html;
            }

            getEstadoBadge(estado) {
                const badges = {
                    'generado': 'badge-generado',
                    'firmado': 'badge-firmado',
                    'aprobado': 'badge-aprobado',
                    'publicado': 'badge-publicado'
                };
                return `<span class="badge ${badges[estado] || 'badge-secondary'}">${estado.toUpperCase()}</span>`;
            }

            getWorkflowSteps(estado) {
                const steps = ['G', 'F', 'A', 'P'];
                const estados = ['generado', 'firmado', 'aprobado', 'publicado'];
                const currentIndex = estados.indexOf(estado);
                
                return steps.map((step, index) => {
                    const isActive = index <= currentIndex;
                    return `<span class="workflow-step ${isActive ? 'active' : 'inactive'}">${step}</span>`;
                }).join('');
            }

            getActionButton(recibo) {
                switch (recibo.estado) {
                    case 'generado':
                        return `<button class="btn btn-outline-warning" onclick="empleadoPortal.showFirmarModal(${recibo.id})" title="Firmar">
                            <i class="fas fa-signature"></i>
                        </button>`;
                    case 'firmado':
                    case 'aprobado':
                    case 'publicado':
                        return `<button class="btn btn-outline-secondary" disabled title="Ya firmado">
                            <i class="fas fa-check"></i>
                        </button>`;
                    default:
                        return '';
                }
            }

            updateStats() {
                const totalRecibos = this.recibos.length;
                const recibosPendientes = this.recibos.filter(r => r.estado === 'generado').length;

                document.getElementById('total-recibos').textContent = totalRecibos;
                document.getElementById('recibos-pendientes').textContent = recibosPendientes;
            }

            clearFilters() {
                const currentDate = new Date();
                document.getElementById('mes-filtro').value = currentDate.getMonth() + 1;
                document.getElementById('año-filtro').value = currentDate.getFullYear();
                document.getElementById('estado-filtro').value = '';
                this.loadRecibos();
            }

            viewRecibo(reciboId) {
                const recibo = this.recibos.find(r => r.id === reciboId);
                if (recibo) {
                    alert(`Detalles del Recibo #${recibo.id}:\n\n` +
                          `Período: ${recibo.periodo}\n` +
                          `Sueldo Bruto: $${parseFloat(recibo.sueldo_bruto).toFixed(2)}\n` +
                          `Bonificaciones: $${parseFloat(recibo.bonificaciones || 0).toFixed(2)}\n` +
                          `Descuentos: $${parseFloat(recibo.descuentos || 0).toFixed(2)}\n` +
                          `Impuestos: $${parseFloat(recibo.impuestos || 0).toFixed(2)}\n` +
                          `Sueldo Neto: $${parseFloat(recibo.sueldo_neto).toFixed(2)}\n` +
                          `Estado: ${recibo.estado.toUpperCase()}\n` +
                          `Fecha Generación: ${recibo.fecha_generacion || 'No especificada'}`);
                }
            }

            showFirmarModal(reciboId) {
                const recibo = this.recibos.find(r => r.id === reciboId);
                if (!recibo) return;

                const detalles = document.getElementById('recibo-detalles');
                detalles.innerHTML = `
                    <h6>Recibo #${recibo.id} - ${recibo.periodo}</h6>
                    <div class="row">
                        <div class="col-6">
                            <strong>Sueldo Bruto:</strong><br>
                            $${parseFloat(recibo.sueldo_bruto).toFixed(2)}
                        </div>
                        <div class="col-6">
                            <strong>Sueldo Neto:</strong><br>
                            $${parseFloat(recibo.sueldo_neto).toFixed(2)}
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-6">
                            <strong>Bonificaciones:</strong><br>
                            $${parseFloat(recibo.bonificaciones || 0).toFixed(2)}
                        </div>
                        <div class="col-6">
                            <strong>Descuentos:</strong><br>
                            $${parseFloat(recibo.descuentos || 0).toFixed(2)}
                        </div>
                    </div>
                `;

                // Guardar el ID del recibo para firmar
                document.getElementById('btn-firmar').setAttribute('data-recibo-id', reciboId);
                document.getElementById('confirmarFirma').checked = false;
                document.getElementById('btn-firmar').disabled = true;

                $('#firmarModal').modal('show');
            }

            async firmarRecibo() {
                const reciboId = document.getElementById('btn-firmar').getAttribute('data-recibo-id');
                
                try {
                    const response = await fetch(`${this.apiBase}/recibos/${reciboId}/firmar`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            empleado_id: this.empleadoData.id,
                            firmado_por: `${this.empleadoData.nombre} ${this.empleadoData.apellido}`
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        alert('Recibo firmado exitosamente');
                        $('#firmarModal').modal('hide');
                        this.loadRecibos();
                    } else {
                        alert('Error al firmar recibo: ' + result.error);
                    }
                } catch (error) {
                    console.error('Error firmando recibo:', error);
                    alert('Error al firmar el recibo');
                }
            }

            async descargarRecibo(reciboId) {
                try {
                    const response = await fetch(`${this.apiBase}/recibos/${reciboId}/descargar`);
                    
                    if (response.ok) {
                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `recibo_${reciboId}.pdf`;
                        a.click();
                        window.URL.revokeObjectURL(url);
                    } else {
                        const result = await response.json();
                        alert('Error al descargar recibo: ' + result.error);
                    }
                } catch (error) {
                    console.error('Error descargando recibo:', error);
                    alert('Error al descargar el recibo');
                }
            }

            showProfile() {
                alert('Funcionalidad de perfil en desarrollo');
            }

            showSettings() {
                alert('Funcionalidad de configuración en desarrollo');
            }

            logout() {
                localStorage.removeItem('user_data');
                window.location.href = 'login.html';
            }

            showError(message) {
                // Implementar notificación de error
                console.error(message);
            }
        }

        // Inicializar cuando el DOM esté listo
        let empleadoPortal;
        document.addEventListener('DOMContentLoaded', function() {
            empleadoPortal = new EmpleadoPortal();
        });
    </script>
</body>

</html>
